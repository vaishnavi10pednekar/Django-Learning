{% extends "base.html" %}

{% block title %}
Edit Information
{% endblock title %}

{% block content %} 
<div class="container mt-4">

    <form method="post">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">First Name</label>
            <input type="text" name = "First_Name" class="form-control" value="{{edit_inf.First_Name}}">
        </div>

        <div class="mb-3">
            <label class="form-label">Surname</label>
            <input type="text" name = "SurName" class="form-control" value="{{edit_inf.SurName}}">
        </div>

        <div class="mb-3">
            <label class="form-label">Age</label>
            <input type="number" name = "Age" class="form-control" value="{{edit_inf.Age}}">
        </div>

        <div class="mb-3">
            <label class="form-label">Gender</label>
            <input class="form-control" name = "Gender" value="{{edit_inf.Gender}}">
        </div>

        <div class="mb-3">
            <label class="form-label">Date of Birth</label>
            <input class="form-control" name = "Date_of_birth" value="{{ edit_inf.Date_of_birth|date:'Y-m-d' }}">
        </div>

        <button type="submit" class="btn btn-primary">
            Update
        </button>

    </form>
{% endblock content %}
