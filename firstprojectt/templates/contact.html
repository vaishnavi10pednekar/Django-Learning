{% extends "base.html" %}

{%block html_content%}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - To Do App</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .hero{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .hero-content{
            max-width: 700px;
            color: white;
        }

        .hero-content h1{
            font-size: 3.5rem;
            margin-bottom: 20px;
        }

        .contact-info p{
            font-size: 1.2rem;
            margin: 15px 0;
        }

        .hero-content button{
            margin-top: 25px;
            padding: 14px 32px;
            border: none;
            border-radius: 8px;
            background: white;
            color: #764ba2;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .hero-content button:hover{
            transform: translateY(-4px);
        }
    </style>
</head>
<body>

<section class="hero">
    <div class="hero-content">
        <h1>Contact Us</h1>

        <div class="contact-info">
            <p>📧 support@todoapp.com</p>
            <p>📞 +91 98765 43210</p>
            <p>📍 Mumbai, Maharashtra, India</p>
        </div>

        <button>Send Message</button>
    </div>
</section>

</body>
</html>

    {%endblock html_content%}
