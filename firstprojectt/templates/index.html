{% extends "base.html" %}

{% block html_content%}
    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do App</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .hero{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .hero-content{
            max-width: 700px;
            color: white;
        }

        .hero-content h1{
            font-size: 3.5rem;
            margin-bottom: 20px;
        }

        .hero-content p{
            font-size: 1.2rem;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .hero-content button{
            padding: 14px 32px;
            border: none;
            border-radius: 8px;
            background: white;
            color: #764ba2;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .hero-content button:hover{
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <section class="hero">
        <div class="hero-content">
            <h1>Stay Focused. Stay Productive.</h1>

            <p>
                Organize your daily tasks, track your progress, and
                accomplish your goals with a simple and efficient
                To-Do App designed to boost your productivity.
            </p>

            <button><a href="{% url 'task' %}">Ge Started</a> </button>
        </div>
    </section>

</body>
</html>
    {%endblock html_content%}
